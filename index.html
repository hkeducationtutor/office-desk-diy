<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌間 · 辦公室桌擺設 DIY</title><link rel="stylesheet" href="style.css"><body><header><div><small>你的日常・由你設計</small><h1>桌間 <span>辦公室桌擺設 DIY</span></h1></div><nav><button id="resetView">重設視角</button><button id="save">儲存</button><button id="load">讀取</button><button id="export">匯出 JSON</button><button id="import">匯入場景</button></nav></header><main><aside><h2>加入你的日常</h2><p>揀一件擺設，開始佈置。</p><div id="catalog"></div><section><h2>使用方法</h2><p>拖曳物件：桌面移動<br>拖曳空白處：環繞視角<br>滾輪：拉近／拉遠<br>方向鍵：微調位置<br>Q / E：旋轉</p></section><label><input id="ao" type="checkbox" checked> 環境遮蔽 SSAO</label><label><input id="bloom" type="checkbox" checked> 柔光 Bloom</label></aside><div id="viewport"><div class="badge">即時 3D · 離線創作</div><div id="status" role="status">正在準備工作桌…</div></div><aside><h2>擺設設定</h2><div id="empty">點選桌上物件，調整你的風格。</div><div id="editor" hidden><h3 id="name"></h3><label>顏色<input type="color" id="color"></label><label>材質<select id="material"><option value="plastic">塑膠</option><option value="wood">木</option><option value="metal">金屬</option><option value="glass">玻璃</option></select></label><label>旋轉 <output id="angleOut"></output><input type="range" id="angle" min="-180" max="180" value="0"></label><label>大小 <output id="sizeOut"></output><input type="range" id="size" min="0.5" max="1.8" step="0.05" value="1"></label><button id="copy">複製擺設</button><button id="remove">移除選中擺設</button></div><section><h2>一張桌，一點靈感。</h2><p>暖木、霧面金屬與午後柔光。為工作留下喜歡的空間。</p></section></aside></main><dialog id="jsonDialog"><h2>匯入場景</h2><p>選擇 JSON 檔案，或貼上之前匯出的內容。</p><input id="file" type="file" accept=".json,application/json"><textarea id="json" placeholder="貼上場景 JSON"></textarea><div><button id="cancel">取消</button><button id="apply">套用場景</button></div><p id="error" role="alert"></p></dialog><script src="vendor/three.min.js"></script><script src="js/main.js"></script></body></html>
